name: Build iOS app

# Compiles the Xcode project on a GitHub-hosted Mac and publishes an unsigned dash.ipa
# on the "ios-latest" release. Sign and install it with your own Apple ID (see README).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Archive (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/dash.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package dash.ipa
        run: |
          mkdir -p build/Payload
          cp -R build/dash.xcarchive/Products/Applications/App.app build/Payload/
          (cd build && zip -qry dash.ipa Payload)
          ls -lh build/dash.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: dash-ipa
          path: build/dash.ipa
      - name: Publish to the ios-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest build/dash.ipa \
            --title "dash for iPhone (latest build)" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Install with Sideloadly or Xcode using your Apple ID; see the README." \
            --target "$GITHUB_SHA" --prerelease
