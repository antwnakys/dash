name: Build iOS app

# Compiles the Xcode project on a GitHub-hosted Mac and publishes an unsigned dash.ipa
# on the "ios-latest" release. Sign and install it with your own Apple ID (see README).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      # Ready-to-run Xcode folder (project + the plugin sources it points at), so a Mac without Node can build it.
      - name: Package the Xcode project
        run: |
          mkdir -p build/dash-xcode
          cp -R ios build/dash-xcode/
          rm -rf build/dash-xcode/ios/App/build build/dash-xcode/ios/DerivedData
          for dep in $(grep -o 'node_modules/[^"]*' ios/App/CapApp-SPM/Package.swift); do
            mkdir -p "build/dash-xcode/$(dirname "$dep")"
            cp -R "$dep" "build/dash-xcode/$dep"
          done
          printf 'dash %s for Xcode\n\nOpen ios/App/App.xcodeproj, choose your team and iPhone, then Product > Clean Build Folder and Run.\n' "${GITHUB_SHA::7}" > build/dash-xcode/START-HERE.txt
          (cd build && zip -qry dash-xcode.zip dash-xcode)
          ls -lh build/dash-xcode.zip
      - name: Archive (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/dash.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package dash.ipa
        run: |
          mkdir -p build/Payload
          cp -R build/dash.xcarchive/Products/Applications/App.app build/Payload/
          (cd build && zip -qry dash.ipa Payload)
          ls -lh build/dash.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: dash-ipa
          path: build/dash.ipa
      - name: Publish to the ios-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest build/dash.ipa build/dash-xcode.zip \
            --title "dash for iPhone (latest build)" \
            --notes "Build of ${GITHUB_SHA::7}. dash.ipa is unsigned (install with Sideloadly); dash-xcode.zip is the ready-to-run Xcode project." \
            --target "$GITHUB_SHA" --prerelease
