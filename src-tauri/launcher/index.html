<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dash</title>
    <!--
      The Mac app opens this page first and goes straight on to the live website, so dash on the Mac
      is always the latest version. Without internet it waits here and carries on once it's back.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f2f0;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --accent: #0a6cff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --ink: #f5f5f7;
          --muted: #a1a1a6;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      #offline {
        display: none;
        max-width: 22rem;
        padding: 0 16px;
      }
      body.offline #offline {
        display: block;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 6px;
      }
      p {
        color: var(--muted);
        margin: 0 0 18px;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        padding: 8px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="offline">
      <h1>No internet</h1>
      <p>dash opens as soon as your Mac is back online.</p>
      <button type="button" onclick="go()">Try again</button>
    </div>
    <script>
      const SITE = 'https://antwnakys.github.io/dash/'
      function go() {
        if (navigator.onLine) location.replace(SITE)
        else document.body.classList.add('offline')
      }
      window.addEventListener('online', go)
      go()
    </script>
  </body>
</html>
